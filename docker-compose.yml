services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-realty}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment: &app_env
      POSTGRES_DB: ${POSTGRES_DB:-realty}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  test:
    build: .
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /code/backend
    entrypoint: ["pytest"]

volumes:
  pgdata:
